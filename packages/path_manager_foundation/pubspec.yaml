name: path_manager_foundation
resolution: workspace
description: iOS and macOS implementation of the path_manager plugin using Foundation Objective-C FFI.
version: 0.9.0
homepage: https://github.com/maranix/path_manager
repository: https://github.com/maranix/path_manager/tree/main/packages/path_manager_foundation
issue_tracker: https://github.com/maranix/path_manager/issues

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  path_manager_platform_interface: ^0.9.0
  objective_c: ^9.6.4
  ffi: ^2.2.0

dev_dependencies:
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  logging: ^1.3.0
  test: ^1.28.0

flutter:
  plugin:
    implements: path_manager
    platforms:
      ios:
        dartPluginClass: FoundationPathManager
      macos:
        dartPluginClass: FoundationPathManager
