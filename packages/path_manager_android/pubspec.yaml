name: path_manager_android
resolution: workspace
description: Android implementation of the path_manager plugin using JNI via FFI.
version: 0.9.0
homepage: https://github.com/maranix/path_manager
repository: https://github.com/maranix/path_manager/tree/main/packages/path_manager_android
issue_tracker: https://github.com/maranix/path_manager/issues

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  path_manager_platform_interface: ^0.9.0
  jni: ^1.1.2
  jni_flutter: ^1.0.4+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  jnigen: ^1.0.1
  logging: ^1.3.0
  test: ^1.28.0

flutter:
  plugin:
    implements: path_manager
    platforms:
      android:
        dartPluginClass: AndroidPathManager
