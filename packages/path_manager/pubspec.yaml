name: path_manager
resolution: workspace
description: Plugin for getting commonly used locations on host file system via FFI
homepage: https://github.com/maranix/path_manager
repository: https://github.com/maranix/path_manager/tree/main/packages/path_manager
issue_tracker: https://github.com/maranix/path_manager/issues
version: 0.9.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  path_manager_platform_interface: ^0.9.0
  path_manager_android: ^0.9.0
  path_manager_foundation: ^0.9.0
  path_manager_linux: ^0.9.0
  path_manager_windows: ^0.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  test: ^1.28.0

flutter:
  plugin:
    platforms:
      android:
        default_package: path_manager_android
      ios:
        default_package: path_manager_foundation
      macos:
        default_package: path_manager_foundation
      linux:
        default_package: path_manager_linux
      windows:
        default_package: path_manager_windows

topics:
  - files
  - path-provider
  - paths
  - path-manager
  - device-directory
