name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_unit_tests:
    name: Analysis & Common Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: dart analyze .

      - name: Run Unit Tests
        run: |
          for pkg in packages/path_manager_platform_interface packages/path_manager_android packages/path_manager_linux packages/path_manager_windows packages/path_manager; do
            echo "Testing $pkg..."
            (cd "$pkg" && flutter test)
          done

      - name: Dry-Run Publish All Packages
        run: |
          for pkg in packages/path_manager_platform_interface packages/path_manager_android packages/path_manager_foundation packages/path_manager_linux packages/path_manager_windows packages/path_manager; do
            echo "Dry-run publishing $pkg..."
            (cd "$pkg" && dart pub publish --dry-run)
          done

  linux:
    name: Linux Native Tests & Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install Linux Build Dependencies & xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Linux Package Unit Tests
        run: |
          cd packages/path_manager_linux
          flutter test

      - name: Run Linux Example Unit/Widget Tests
        run: |
          cd packages/path_manager_linux/example
          flutter test

      - name: Build Linux Example Application
        run: |
          cd packages/path_manager/example
          flutter build linux --debug

      - name: Run Linux Package Example Integration Tests
        run: |
          cd packages/path_manager_linux/example
          xvfb-run --auto-servernum flutter test integration_test -d linux

      - name: Run Multiplatform Linux Integration Tests
        run: |
          cd packages/path_manager/example
          xvfb-run --auto-servernum flutter test integration_test -d linux

  windows:
    name: Windows Native Tests & Integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Windows Package Unit Tests
        run: |
          cd packages/path_manager_windows
          flutter test

      - name: Run Windows Example Unit/Widget Tests
        run: |
          cd packages/path_manager_windows/example
          flutter test

      - name: Build Windows Example Application
        run: |
          cd packages/path_manager/example
          flutter build windows --debug

      - name: Run Windows Package Example Integration Tests
        run: |
          cd packages/path_manager_windows/example
          flutter test integration_test -d windows

      - name: Run Multiplatform Windows Integration Tests
        run: |
          cd packages/path_manager/example
          flutter test integration_test -d windows

  macos_and_ios:
    name: macOS & iOS Native Tests & Integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable Spotlight on workspace to speed up I/O
        run: sudo mdutil -i off "${{ github.workspace }}"

      - name: Boot iOS Simulator Early (Background)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available 'iPhone' | grep -m 1 -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -n "$DEVICE_ID" ]; then
            echo "BOOT_DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
            xcrun simctl boot "$DEVICE_ID" || true
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Foundation Package Unit Tests
        run: |
          cd packages/path_manager_foundation
          flutter test

      - name: Run Foundation Example Unit/Widget Tests
        run: |
          cd packages/path_manager_foundation/example
          flutter test

      - name: Build macOS Example Application
        run: |
          cd packages/path_manager/example
          flutter build macos --debug

      - name: Run Foundation Example macOS Integration Tests
        run: |
          cd packages/path_manager_foundation/example
          flutter test integration_test -d macos

      - name: Run Multiplatform macOS Integration Tests
        run: |
          cd packages/path_manager/example
          flutter test integration_test -d macos

      - name: Build iOS Example Application
        run: |
          cd packages/path_manager/example
          flutter build ios --no-codesign --debug

      - name: Run iOS Simulator Integration Tests
        run: |
          if [ -n "$BOOT_DEVICE_ID" ]; then
            cd packages/path_manager/example
            flutter test integration_test -d "$BOOT_DEVICE_ID"
          else
            echo "No iPhone simulator found, skipping iOS integration test run"
          fi

  android:
    name: Android Tests & Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Android Package Unit Tests
        run: |
          cd packages/path_manager_android
          flutter test

      - name: Run Android Example Unit/Widget Tests
        run: |
          cd packages/path_manager_android/example
          flutter test

      - name: Build Android Example APK
        run: |
          cd packages/path_manager/example
          flutter build apk --debug

      - name: Run Android Emulator Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: cd packages/path_manager/example && flutter test integration_test
